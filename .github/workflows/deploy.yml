name: Deploy to Aliyun FC

on:
  push:
    branches:
      - dev # 👈 监测 dev 分支的推送

jobs:
  deploy:
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Linux 环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 匹配 Debian 12 的 Python 版本

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 1. 导出依赖 (GitHub Linux 环境可以直接运行)
          pip install uv
          uv export --format requirements-txt --no-hashes > requirements.txt
          
          # 2. 安装依赖到 python 目录 (在 Linux 下安装，完美兼容 FC)
          pip install -r requirements.txt -t python

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Deploy to FC
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
        run: |
          # 配置阿里云密钥
          s config add -a 本地使用 --AccessKeyID ${ALIBABA_CLOUD_ACCESS_KEY_ID} --AccessKeySecret ${ALIBABA_CLOUD_ACCESS_KEY_SECRET} --AccountID ${ALIBABA_CLOUD_ACCOUNT_ID} -f
          # 执行部署
          s deploy --use-local -y
