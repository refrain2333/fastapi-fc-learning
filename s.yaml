edition: 3.0.0
name: fastapi-fc-app
access: "本地使用" 

vars: 
  region: "cn-beijing" 
  functionName: "fastapi-debian12-final" 

resources:
  fastapi_func:
    component: fc3
    actions:
      pre-deploy:
        - run: uv export --format requirements-txt --no-hashes > requirements.txt
          path: ./
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: 'FastAPI On Debian 12 (Web Server Mode)'
      runtime: custom.debian12
      code: ./
      timeout: 60
      memorySize: 512
      cpu: 0.5
      diskSize: 512
      instanceConcurrency: 10
      customRuntimeConfig: 
        command:
          - python3
        args:
          - main.py 
        port: 9000
      environmentVariables:
        PYTHONPATH: /code/python
        TZ: Asia/Shanghai
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: [GET, POST, PUT, DELETE, OPTIONS]
