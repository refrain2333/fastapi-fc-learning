edition: 3.0.0
name: fastapi-fc-app
access: "本地使用" 

vars: 
  region: "cn-hongkong" 
  functionName: "fastapi-debian12-py312" 

resources:
  fastapi_func:
    component: fc3
    actions:
      pre-deploy:
        - run: uv export --format requirements-txt --no-hashes > requirements.txt
          path: ./
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: 'FastAPI On Debian 12 + Python 3.12 Layer'
      runtime: custom.debian12
      layers:
        - acs:fc:cn-hongkong:official:layers/Python312/versions/1
      code: ./
      timeout: 60
      memorySize: 512
      cpu: 0.5
      diskSize: 512
      instanceConcurrency: 10
      customRuntimeConfig: 
        command:
          - /opt/python3.12/bin/python3
        args:
          - main.py 
        port: 9000
      environmentVariables:
        PYTHONPATH: /code/python:/opt/python3.12/lib/python3.12/site-packages
        PATH: /opt/python3.12/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        TZ: Asia/Shanghai
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: [GET, POST, PUT, DELETE, OPTIONS]
