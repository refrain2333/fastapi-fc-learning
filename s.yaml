# 阿里云 Serverless Devs 配置文件
edition: 1.0.0
name: fastapi-fc-app

services:
  fastapi-service:
    component: fc
    actions:
      pre-deploy:
        - run: uv export --format requirements-txt > requirements.txt
          path: ./
    props:
      region: cn-hongkong
      service:
        name: fc-learning
        description: 'FastAPI 容器化学习项目'
      function:
        name: fastapi-func
        description: '使用 Docker 容器部署的 FastAPI'
        runtime: custom-container # 关键：切换为容器运行时
        codeUri: ./ # 指向包含 Dockerfile 的目录
        memorySize: 512 # 容器运行建议给到 512MB 以上，启动更稳
        timeout: 60
        caPort: 9000
        customContainerConfig:
          # 注意：这里的 image 地址需要替换为你自己的阿里云容器镜像仓库地址
          # 格式：registry.cn-hongkong.aliyuncs.com/<命名空间>/<仓库名>:<标签>
          image: "registry.cn-hongkong.aliyuncs.com/fc-learning/fastapi-app:v1"
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods: [GET, POST, PUT, DELETE]
      customDomains:
        - domainName: auto
          protocol: HTTP
          routeConfigs:
            - path: /*
