edition: 3.0.0
name: fastapi-fc-app
access: "本地使用" 

vars: 
  region: "cn-beijing" 
  functionName: "fastapi-fixed-312" 
  memorySize: 512

resources:
  fastapi_func:
    component: fc3
    actions:
      pre-deploy:
        - run: uv export --format requirements-txt --no-hashes > requirements.txt
          path: ./
    props:
      region: ${vars.region}
      functionName: ${vars.functionName}
      description: 'FastAPI On Function Compute (Native Python 3.12)'
      runtime: python3.12
      handler: app.main.handler
      code: ./
      timeout: 60
      memorySize: ${vars.memorySize}
      cpu: 0.5
      diskSize: 512
      instanceConcurrency: 10
      environmentVariables:
        PYTHONPATH: /code/python
        TZ: Asia/Shanghai
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods: [GET, POST, PUT, DELETE, OPTIONS]
